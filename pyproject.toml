[project]
name = "rejstrik-mcp"
version = "0.1.0"
description = "Czech registry MCP that reads the documents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "janf19", email = "jfaller@seznam.cz" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "selectolax>=0.3.21",
    "anthropic>=0.92",
    "openai>=2.30",
    "python-dotenv>=1.0",
    "mcp>=1.2",
    "mcp-ui-server>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
rejstrik = "rejstrik.cli.main:app"
rejstrik-mcp = "rejstrik.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rejstrik"]

[tool.pytest.ini_options]
pythonpath = ["src"]
